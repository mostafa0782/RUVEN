name: Publish RUVEN update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed vX.Y.Z tag on main
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release tag and derive version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be numeric semver, for example v0.1.641."
            exit 1
          fi

          git fetch --force --tags origin main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_SHA" origin/main || {
            echo "Release tag must point to a commit already contained in main."
            exit 1
          }

          VERSION_NAME="${RELEASE_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR_NUM=$((10#$MAJOR))
          MINOR_NUM=$((10#$MINOR))
          PATCH_NUM=$((10#$PATCH))
          if [ "$MAJOR_NUM" -eq 0 ] && [ "$MINOR_NUM" -eq 1 ]; then
            VERSION_CODE="$PATCH_NUM"
          else
            VERSION_CODE=$((MAJOR_NUM * 1000000 + MINOR_NUM * 1000 + PATCH_NUM))
          fi
          if [ "$VERSION_CODE" -lt 1 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Version code is outside Android's supported range."
            exit 1
          fi

          RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?head_sha=${TAG_SHA}&per_page=100")"
          LATEST_ANDROID_BUILD="$(printf '%s' "$RUNS_JSON" | jq '[.workflow_runs[].run_number] | max // 0')"
          SUCCESSFUL_BUILDS="$(printf '%s' "$RUNS_JSON" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$SUCCESSFUL_BUILDS" -eq 0 ] || [ "$LATEST_ANDROID_BUILD" -eq 0 ]; then
            echo "No successful Android CI run exists for this exact tagged commit."
            exit 1
          fi
          if [ "$VERSION_CODE" -le "$LATEST_ANDROID_BUILD" ]; then
            echo "Release versionCode ($VERSION_CODE) must exceed the latest Android CI run number ($LATEST_ANDROID_BUILD)."
            echo "Choose a higher 0.1.x patch number and create a new tag."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check out reviewed release source
        env:
          TAG_SHA: ${{ steps.version.outputs.tag_sha }}
        run: git checkout --detach "$TAG_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # pinned
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # pinned
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ruven-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ruven-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest -PVERSION_CODE=${{ steps.version.outputs.version_code }} -PVERSION_NAME=${{ steps.version.outputs.version_name }}

      - name: Build signed update APK
        run: gradle :app:assembleRelease -PVERSION_CODE=${{ steps.version.outputs.version_code }} -PVERSION_NAME=${{ steps.version.outputs.version_name }}

      - name: Verify signed APK
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk RUVEN.apk
          sha256sum RUVEN.apk > RUVEN.apk.sha256
          sha256sum --check RUVEN.apk.sha256

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "$RELEASE_TAG" RUVEN.apk RUVEN.apk.sha256 \
            --title "RUVEN $VERSION_NAME" \
            --generate-notes \
            --verify-tag
