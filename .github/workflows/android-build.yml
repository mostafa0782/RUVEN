name: Android build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and branch verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # pinned
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # pinned
        with:
          packages: 'platform-tools platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Install Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      # Push builds use one persistent signing identity. Pull-request builds stay
      # on the disposable debug key because secrets are unavailable to fork PRs.
      - name: Configure persistent Android signing
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          RUVEN_KEYSTORE_BASE64: ${{ secrets.RUVEN_KEYSTORE_BASE64 }}
          RUVEN_KEYSTORE_PASSWORD: ${{ secrets.RUVEN_KEYSTORE_PASSWORD }}
          RUVEN_KEY_ALIAS: ${{ secrets.RUVEN_KEY_ALIAS }}
          RUVEN_KEY_PASSWORD: ${{ secrets.RUVEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RUVEN_KEYSTORE_BASE64" || -z "$RUVEN_KEYSTORE_PASSWORD" || -z "$RUVEN_KEY_ALIAS" || -z "$RUVEN_KEY_PASSWORD" ]]; then
            echo "::warning::Persistent signing secrets are not configured. Continuing with the standard debug signing key; this APK may not update an existing installation signed with another key."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/ruven-upload.jks"
          printf '%s' "$RUVEN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$RUVEN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$RUVEN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$RUVEN_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.1.0

      - name: Build consistently signed debug APK for feature branches
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: gradle :app:assembleDebug -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.1.${{ github.run_number }}

      - name: Upload debug APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned
        with:
          name: RUVEN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
